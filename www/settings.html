<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
    <title>MollyStudio — Параметры</title>
    <link rel="icon" type="image/png" href="assets/images/icon/icon256.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            user-select: none;
        }

        .settings-win-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background-color: var(--md-surface);
        }

        /* Frameless Titlebar */
        .settings-win-titlebar {
            height: var(--md-titlebar-height, 34px);
            background-color: var(--md-surface-container);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            -webkit-app-region: drag;
            flex-shrink: 0;
            z-index: 10;
        }

        .settings-win-titlebar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--md-on-surface);
        }

        .settings-win-titlebar-icon {
            width: 16px;
            height: 16px;
        }

        .settings-win-titlebar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag;
        }

        /* Main Settings Layout */
        .settings-win-body {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 12px;
            gap: 12px;
        }

        /* Sidebar Tabs */
        .settings-win-sidebar {
            width: 210px;
            background-color: var(--md-surface-container);
            border-radius: var(--md-shape-corner-card, 28px);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .settings-win-sidebar::-webkit-scrollbar {
            display: none;
        }

        /* Content Area */
        .settings-win-content-wrap {
            flex: 1;
            min-width: 0;
            min-height: 0;
            background-color: var(--md-surface-container);
            border-radius: var(--md-shape-corner-card, 28px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .settings-win-content-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Footer */
        .settings-win-footer {
            height: 48px;
            background-color: var(--md-surface-container-high);
            border-radius: 0 0 var(--md-shape-corner-card, 28px) var(--md-shape-corner-card, 28px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .settings-win-status {
            font-size: 11px;
            color: var(--md-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: var(--md-shape-corner-thumb, 9999px);
            background-color: var(--md-primary);
        }
    </style>
    <link rel="stylesheet" href="css/material-you.css">
    <link rel="stylesheet" href="css/application-ui.css">
    <script type="module" src="js/ui/ApplicationUI.js"></script>
</head>
<body>
    <div class="settings-win-shell">
        <!-- Titlebar -->
        <header class="settings-win-titlebar">
            <div class="settings-win-titlebar-left">
                <img src="assets/images/icon/icon256.png" class="settings-win-titlebar-icon" alt="MollyStudio">
                <span>Параметры программы</span>
            </div>
            <div class="settings-win-titlebar-controls">
                <button class="titlebar-btn m3-bubble-action" id="btn-win-min" title="Свернуть" aria-label="Свернуть" type="button">
                    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5.5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
                <button class="titlebar-btn titlebar-btn-close m3-bubble-action" id="btn-win-close" title="Закрыть" aria-label="Закрыть" type="button">
                    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.8 1.8l6.4 6.4M8.2 1.8l-6.4 6.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <!-- Body -->
        <div class="settings-win-body">
            <!-- Sidebar -->
            <nav class="settings-win-sidebar" id="settings-tabs-list" role="tablist" aria-label="Разделы настроек" aria-orientation="vertical">
                <button class="settings-tab-btn active m3-bubble-action" id="settings-tab-appearance" data-tab="appearance" role="tab" aria-controls="settings-content-area" aria-selected="true" type="button">
                    <i class="material-symbols-rounded">palette</i>
                    <span>Внешний вид</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-canvas" data-tab="canvas" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">grid_view</i>
                    <span>Холст и сетка</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-tools" data-tab="tools" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">tune</i>
                    <span>Инструменты</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-export" data-tab="export" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">download</i>
                    <span>Экспорт и авто</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-discord" data-tab="discord" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">sports_esports</i>
                    <span>Discord RPC</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-backup" data-tab="backup" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">database</i>
                    <span>Данные и сброс</span>
                </button>
                <button class="settings-tab-btn m3-bubble-action" id="settings-tab-hotkeys" data-tab="hotkeys" role="tab" aria-controls="settings-content-area" aria-selected="false" type="button">
                    <i class="material-symbols-rounded">keyboard</i>
                    <span>Горячие клавиши</span>
                </button>
            </nav>

            <!-- Content Area -->
            <main class="settings-win-content-wrap">
                <section class="settings-win-content-scroll" id="settings-content-area" role="tabpanel" aria-labelledby="settings-tab-appearance" tabindex="0">
                    <!-- Populated by SettingsWindowApp.js -->
                </section>
                <footer class="settings-win-footer">
                    <div class="settings-win-status">
                        <span class="status-dot"></span>
                        <span>Все изменения сохраняются автоматически</span>
                    </div>
                    <button class="md-btn primary m3-bubble-action" id="btn-done" type="button">Готово</button>
                </footer>
            </main>
        </div>
    </div>

    <!-- Toast Feedback -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/windows/SettingsWindowApp.js"></script>
</body>
</html>
