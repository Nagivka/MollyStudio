name: Mac hardware validation
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario on a separate QA Mac
        required: true
        type: choice
        options: [macos-13, intel-webgl]
permissions:
  contents: read
jobs:
  mac:
    if: github.repository == 'Nagivka/MollyStudio'
    runs-on: [self-hosted, macOS, mollystudio-qa]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify the requested hardware or OS
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          sw_vers
          if [[ "$SCENARIO" == macos-13 ]]; then
            [[ $(sw_vers -productVersion) == 13.* ]]
          else
            [[ $(node -p process.arch) == x64 ]]
            [[ $(sysctl -in sysctl.proc_translated || true) != 1 ]]
          fi
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Verify Intel graphics with the native driver
        if: inputs.scenario == 'intel-webgl'
        run: npm run test:titles:edges -- --require-webgl
      - name: Verify the packaged app on Ventura
        if: inputs.scenario == 'macos-13'
        run: |
          npm run dist
          directory=$(mktemp -d "$RUNNER_TEMP/molly-ventura.XXXXXX")
          ditto -x -k dist/*-mac.zip "$directory"
          codesign --verify --deep --strict "$directory/MollyStudio.app"
          node scripts/packaged-platform-smoke.cjs "$directory/MollyStudio.app/Contents/MacOS/MollyStudio" installed
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-hardware-${{ inputs.scenario }}-${{ github.sha }}
          path: |
            .test-output/*.json
            .test-output/*.log
          include-hidden-files: true
          retention-days: 7
