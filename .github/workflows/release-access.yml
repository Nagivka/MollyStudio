name: Check release repository access
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'Nagivka/MollyStudio' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: UPDATES_REPO_TOKEN
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify destination and token without changing releases
        env:
          RELEASES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.cjs --check-access
