name: Private two-version AppImage upgrade
on:
  workflow_dispatch:
  push:
    branches: ['codex/appimage-upgrade']
permissions:
  contents: read
concurrency:
  group: appimage-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upgrade:
    if: github.repository == 'Nagivka/MollyStudio' && github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck && npm run core:verify && npm test && npm run audit
      - name: Prepare disposable desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64
      - name: Upgrade, restart and recover the project
        run: |
          export TMPDIR=$(mktemp -d "$RUNNER_TEMP/molly-upgrade.XXXXXX")
          launch=()
          if [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true) == 1 ]]; then
            printf 'abi <abi/4.0>,\nprofile mollystudio-ci-upgrade flags=(unconfined) {\n  userns,\n}\n' | sudo apparmor_parser -r
            launch=(aa-exec -p mollystudio-ci-upgrade --)
          fi
          "${launch[@]}" xvfb-run -a node scripts/appimage-version-upgrade.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: appimage-upgrade-${{ matrix.os }}-${{ github.sha }}
          path: |
            .test-output/appimage-version-upgrade.json
            .test-output/appimage-version-upgrade.log
          include-hidden-files: true
          retention-days: 7
