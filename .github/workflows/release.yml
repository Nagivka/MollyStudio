name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish binaries to MollyStudio-Releases
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/platform-compatibility.yml
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  installer:
    if: github.repository == 'Nagivka/MollyStudio'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        run: node scripts/release/validate.cjs
      - run: npm run typecheck
      - run: npm run core:verify
      - run: npm test
      - run: npm run audit
      - run: npm run test:desktop
      - run: npm run test:updates
      - run: npm run test:ui
      - run: npm run test:visual-effects
      - run: npm run dist:nsis
      - name: Keep verified build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MollyStudio-${{ github.sha }}-installer
          path: |
            dist/MollyStudio-*-x64-setup.exe
            dist/MollyStudio-*-x64-setup.exe.blockmap
            dist/MollyStudio-*-x64-setup.exe.sha256
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [installer,native]
    if: github.repository == 'Nagivka/MollyStudio' && (startsWith(github.ref, 'refs/tags/') || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: UPDATES_REPO_TOKEN
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: MollyStudio-${{ github.sha }}-installer
          path: dist
      - name: Collect checked native distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: MollyStudio-*-${{ github.sha }}
          path: native-artifacts
          merge-multiple: true
      - name: Add native files to release staging
        run: cp -n native-artifacts/dist/* dist/
      - name: Publish public release
        env:
          RELEASES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
        run: node scripts/release/publish.cjs
