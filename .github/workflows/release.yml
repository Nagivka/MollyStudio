name: Build Windows portable

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish binaries to MollyStudio-Releases
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    if: github.repository == 'Nagivka/MollyStudio' && github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        run: node scripts/release/validate.cjs
      - run: npm run typecheck
      - run: npm run core:verify
      - run: npm test
      - run: npm run audit
      - run: npm run test:desktop
      - run: npm run dist:portable
      - name: Keep binaries in private Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MollyStudio-${{ github.sha }}-portable
          path: |
            dist/MollyStudio-*-x64-portable.exe
            dist/MollyStudio-*-x64-portable.exe.sha256
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: portable
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: UPDATES_REPO_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: MollyStudio-${{ github.sha }}-portable
          path: dist
      - name: Publish public release
        env:
          RELEASES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.cjs
