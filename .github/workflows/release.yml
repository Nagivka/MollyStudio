name: Build and publish MollyStudio update

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist:nsis -- --publish never

      - name: Publish installer and update metadata
        uses: softprops/action-gh-release@v2
        with:
          repository: Nagivka/MollyStudio-Updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: MollyStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MollyStudio-Setup-*.exe
            dist/MollyStudio-Setup-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
